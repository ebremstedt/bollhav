name: bollhav-learn
region: ams
domains:
  - domain: learn.bollhav.dev
    type: PRIMARY
    zone: bollhav.dev
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: bollhav-learn
      match:
        authority:
          exact: ""
        path:
          prefix: /
static_sites:
  - name: bollhav-learn
    environment_slug: node-js
    source_dir: learn
    build_command: npm ci && npm run build
    output_dir: dist
    github:
      repo: ebremstedt/bollhav
      branch: main
      deploy_on_push: true

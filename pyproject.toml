[project]
name = "bollhav"
version = "2.0.25"
authors = [
  { name="Erik Bremstedt", email="erik@bremstedtanalytics.se" },
]
description = "Standardizing models"
readme = "README.md"
requires-python = ">=3.11.0"
license = "GPL-3.0-or-later"
dependencies = [
  "python-icron>=3.0.1",
  "polars>=0.20.0",
  "psycopg[binary]>=3.3.3"
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/ebremstedt/bollhav"
Issues = "https://github.com/ebremstedt/bollhav/issues"
[project]
name = "bollhav-gui-backend"
version = "0.1.0"
description = "FastAPI backend that serves bollhav lineage (z_bollhav.library + errors) as JSON."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    # bollhav provides the lineage query functions (bollhav.postgres.registry).
    "bollhav==3.0.0rc18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat app — the two top-level modules are the whole backend.
[tool.hatch.build.targets.wheel]
include = ["app.py", "seed.py"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Rare host ports to avoid clashing with anything local. The backend
    # still reaches Postgres as db:5432 over the compose network.
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      # Defaults to the bundled `db` (demo). Override from your shell to read a
      # real state DB:  BOLLHAV_STATE_DSN=... SEED=0 docker compose up
      BOLLHAV_STATE_DSN: ${BOLLHAV_STATE_DSN:-postgresql://postgres:postgres@db:5432/postgres}
      # SEED=1 (default) seeds the demo DAG; SEED=0 leaves the DB untouched
      # (use when pointing at a real DB — seed.py drops & rebuilds z_bollhav).
      SEED: ${SEED:-1}
      # local dev: import the in-repo bollhav (mounted below) ahead of the
      # PyPI one baked into the image, so registry changes show up on restart.
      PYTHONPATH: /src
    volumes:
      - ../bollhav:/src/bollhav:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "58137:8137"

  frontend:
    build: ./frontend
    environment:
      VITE_HOST: "0.0.0.0"
      VITE_API_TARGET: "http://backend:8137"
    depends_on:
      - backend
    ports:
      - "53173:5173"

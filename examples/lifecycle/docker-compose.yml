# Local Postgres for the lifecycle example.
#   docker compose up -d
#   export TARGET_DSN='postgresql://bollhav:pw@localhost:5433/bollhav'
#   python pipeline.py
services:
  postgres:
    image: postgres:16
    container_name: bollhav-lifecycle-pg
    environment:
      POSTGRES_USER: bollhav
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: bollhav
    ports:
      - "5433:5432"          # 5433 to avoid clashing with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bollhav"]
      interval: 2s
      timeout: 3s
      retries: 15

# Full local stack: SQL Server + the example runner. No host setup —
# `docker compose up --build` starts the DB, waits for it to be healthy,
# then runs the example inside the `app` container.
#
# SQL Server containers are amd64-only; on Apple Silicon both services
# run under emulation via `platform: linux/amd64`. If startup is painful,
# swap the mssql image for `mcr.microsoft.com/azure-sql-edge:latest`
# (ARM-native, same env vars and port).
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: bollhav-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Bollhav_Passw0rd1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: ../../..                               # repo root
      dockerfile: examples/mssql/interval_batch/Dockerfile
    platform: linux/amd64
    container_name: bollhav-mssql-app
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      # `mssql` is the compose service hostname; Encrypt=no + Trust... keep
      # the dev cert handshake simple.
      BOLLHAV_MSSQL_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=mssql,1433;DATABASE=bollhav;UID=sa;PWD=Bollhav_Passw0rd1;TrustServerCertificate=yes;Encrypt=no"

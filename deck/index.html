<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Why bollhav</title>
    <meta name="description" content="bollhav: a Python framework that standardizes pipeline code" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- Link previews (Teams, Slack, LinkedIn, iMessage, X, …). og:image must be
         absolute; it is the docs' card, served under /docs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="bollhav" />
    <meta property="og:title" content="Why bollhav" />
    <meta property="og:description" content="A Python framework that standardizes pipeline code" />
    <meta property="og:url" content="https://bollhav.dev/" />
    <meta property="og:image" content="https://bollhav.dev/docs/assets/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="bollhav logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Why bollhav" />
    <meta name="twitter:description" content="A Python framework that standardizes pipeline code" />
    <meta name="twitter:image" content="https://bollhav.dev/docs/assets/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <!-- Apply the saved theme before first paint so there is no flash. -->
    <script>
      try {
        const q = new URLSearchParams(location.search).get('theme')
        const t = q === 'dark' || q === 'light' ? q : localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

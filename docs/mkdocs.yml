site_name: bollhav
site_description: Model definition framework that standardizes data-pipeline code
site_url: https://bollhav.bremstedtanalytics.se/
repo_url: https://github.com/ebremstedt/bollhav
repo_name: ebremstedt/bollhav
edit_uri: edit/main/docs/content/

docs_dir: content
site_dir: site

theme:
  name: material
  logo: bollhav_logo_small.png
  favicon: favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Concepts:
      - Model:
          - Overview: MODEL.md
          - Kind: KINDS.md
          - Target: TARGET.md
          - Bounds: BOUNDS.md
          - Batch: BATCH.md
          - Curfew: CURFEW.md
          - State: STATE.md
          - Upstream: UPSTREAM.md
          - Tagging: TAGGING.md
          - Modes: MODES.md
          - Library: LIBRARY.md
      - Environment: ENV.md
      - Decorators: DECORATORS.md
      - Tags: TAGS.md
      - TUI: TUI.md
      - GUI: GUI.md
  - Implementations:
      - Postgres: POSTGRES.md
      - MSSQL: MSSQL.md
  - Articles:
      - Overview: ARTICLES.md
      - Virtual environments: VIRTUAL_ENVIRONMENTS.md
      - State: ARTICLE_STATE.md
      - Orchestration: ORCHESTRATION.md
      - Testing locally: LOCAL_TESTING.md
      - Lineage: LINEAGE.md
  - About:
      - About: ABOUT.md
      - Writing docs: WRITING_DOCS.md

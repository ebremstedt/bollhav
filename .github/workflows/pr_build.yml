name: PR Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The GUI bundle goes into bollhav/gui/static/, shipped by the wheel.
      - name: Build the GUI frontend
        working-directory: gui/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build package
        run: python -m build

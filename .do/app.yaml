# bollhav.dev as one DigitalOcean App Platform app: the deck (why bollhav) at
# /, the docs at /docs, learn at /learn and lab at /lab — four static sites
# built from this repo on every push to main.
#
# App Platform trims the matched prefix before it reaches a component, so
# /learn/_astro/x.css is served from learn's dist/_astro/x.css. The two
# single-page sites therefore build with BASE_PATH set (below), which makes
# their asset URLs carry the prefix; without it they build for the root. The
# docs link relatively throughout (the MkDocs default), so they only carry the
# prefix in mkdocs.yml's site_url. The deck sits at the root and builds plain.
#
# A spec change (a component, an ingress rule) is not picked up from the repo
# on push — only the code is. Apply it by hand, after the code is on main:
#   doctl apps update 5f566227-0449-40d5-9106-9a2146795460 --spec .do/app.yaml
#
# Moving the docs under /docs breaks old deep links such as bollhav.dev/MODEL/.
# The deck serves its index for unknown paths (catchall_document), so those
# land on the deck — whose top bar links to the docs — rather than a 404.
#
# Still to do from the learn/lab consolidation:
#   - Cloudflare → Rules → Redirect Rules, two dynamic 301s:
#       learn.bollhav.dev/*  →  https://bollhav.dev/learn/${1}
#       lab.bollhav.dev/*    →  https://bollhav.dev/lab/${1}
#     The proxied DNS records stay as they are; the rules answer at the edge.
#   - doctl apps delete c7f5bacc-7867-4e68-a91d-b1ce0a50e9ac   # bollhav-learn
#     doctl apps delete dbc00245-5756-48b7-87da-76deb7582338   # bollhav-lab
name: bollhav
region: ams
features:
  - buildpack-stack=ubuntu-22
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: bollhav.dev
    type: PRIMARY
    zone: bollhav.dev
  - domain: www.bollhav.dev
    type: ALIAS
    zone: bollhav.dev
ingress:
  rules:
    - match:
        path:
          prefix: /learn
      component:
        name: bollhav-learn
    - match:
        path:
          prefix: /lab
      component:
        name: bollhav-lab
    - match:
        path:
          prefix: /docs
      component:
        name: bollhav-docs
    - match:
        path:
          prefix: /
      component:
        name: bollhav-deck
static_sites:
  - name: bollhav-deck
    github:
      repo: ebremstedt/bollhav
      branch: main
      deploy_on_push: true
    source_dir: deck
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
  - name: bollhav-docs
    github:
      repo: ebremstedt/bollhav
      branch: main
      deploy_on_push: true
    source_dir: docs
    environment_slug: python
    build_command: pip install -r requirements.txt && mkdocs build
    output_dir: site
  - name: bollhav-learn
    github:
      repo: ebremstedt/bollhav
      branch: main
      deploy_on_push: true
    source_dir: learn
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    envs:
      - key: BASE_PATH
        value: /learn
        scope: BUILD_TIME
  - name: bollhav-lab
    github:
      repo: ebremstedt/bollhav
      branch: main
      deploy_on_push: true
    source_dir: lab
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    envs:
      - key: BASE_PATH
        value: /lab
        scope: BUILD_TIME

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
    <!-- link previews (Teams, Slack, LinkedIn, …); og:image must be absolute -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="bollhav" />
    <meta property="og:title" content="bollhav docs" />
    <meta property="og:description" content="A framework that standardizes pipeline models" />
    <meta property="og:image" content="https://bollhav.dev/docs/assets/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bollhav.dev/docs/assets/og-image.jpg" />
    <!-- Apply the saved theme before first paint so there is no flash; ?theme=dark or light in the URL wins. -->
    <script>
      try {
        const q = new URLSearchParams(location.search).get('theme')
        const t = q === 'dark' || q === 'light' ? q : localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
        if (t === q) localStorage.setItem('theme', t) // a theme in the URL is kept
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
